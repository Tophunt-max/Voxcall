<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="freeCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="freeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7C3AED" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Card body -->
  <rect x="12" y="20" width="72" height="56" rx="14" fill="url(#freeCard)" filter="url(#freeShadow)"/>
  <!-- Top sheen -->
  <rect x="12" y="20" width="72" height="20" rx="14" fill="#FFFFFF" opacity="0.16"/>
  <!-- Decorative corner dots -->
  <circle cx="74" cy="31" r="2.4" fill="#FFFFFF" opacity="0.5"/>
  <!-- Clock face = free MINUTES -->
  <circle cx="48" cy="49" r="17" fill="#FFFFFF" opacity="0.97"/>
  <circle cx="48" cy="49" r="17" fill="none" stroke="#7C3AED" stroke-opacity="0.15" stroke-width="2"/>
  <path d="M48 39 V49 L56 54" stroke="#7C3AED" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="48" cy="49" r="2.6" fill="#7C3AED"/>
</svg>
